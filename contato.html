<body class="bodyContato">
    
    <header class="cabecalho">
         
        <div class="logo">
            
            <i class="fa-solid fa-earth-americas"></i>
            <span>Explore o Mundo</span>

        </div>

        <div class="navegacao">
            
            <nav class="menu-links">
                <a href="index.html">Início</a>
                <a href="destinos.html">Destinos</a>

            <div class="redes-sociais">
                <a href="" class="whatsapp"><i class="fa-brands fa-whatsapp"></i></a>

    </header>
    <main class="principalContato">

    <section class="secaoContato">
        <!-- <img src="wallhaven-mp7o51.jpg" alt="viagem" class="imgContato"> -->
        <h1 class="tituloContato">Contate-nos</h1>
        <br>
                <form action="contatar" method="POST" class="formulario">
                
                <label for="nome">Nome: </label>
                <input type="text" name="nome" id="nome" placeholder="Digite seu nome completo: " required minlength="2" maxlength="50">
                <br>
                
                <label for="numero">Número: </label>
                <input type="text" name="numero" id="numero" placeholder="Digite seu número de telefone: " required minlength="11" maxlength="15">
                <br>

                <label for="email">Email: </label>
                <input type="email" name="email" id="email" placeholder="exemplo@dominio.com" required>
                <br>

                <label for="dataNasc">Data do nascimento: </label>
                <input type="date" name="dataNasc" id="dataNasc" placeholder="Digite sua data de nascimento: " min="1900-01-01" max="2026-12-31" required>
                <br><br><br>


                

                
                <!-- ------------------ PERÍODO DOS FILMES ---------------------------------------- -->
                
                

                
                <label for="unidade">Selecione a Cidade de Escolha: </label>
                <br>
                
                <select name="unidade" id="unidade" required>

                    <option value="" disa selected>Selecione uma Cidade</option>

                    <option value="zurique">Zurique</option>
                    <option value="paris">Paris</option>
                    <option value="buenosaires">Buenos Aires</option>
                    <option value="quebec">Quebec</option>
                    <option value="vancouver">Vancouver</option>
                    <option value="vancouver">Veneza</option>
                    <option value="vancouver">Nova Iorque</option>
                    <option value="vancouver">Shangai</option>
                    
                </select>
                <br><br>
                <input type="checkbox" name="termos" id="termos">
                <label for="termos">Li e Aceito os Termos</label>
                <br><br>

                <button type="submit" class="btnEnviar">Enviar</button>
                <button type="reset" class="btnLimpar">Limpar Tudo</button>
                
            </form>
    </section>

    </main>
    <footer class="rodape">
        <p>© 2026 Explore o Mundo - Todos os Direitos Reservados</p>
    </footer>
</body>
</html>
